
<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ask Me About</title>
  <desc id="desc">Java, Python, JavaScript, React, Flask, SQL, REST APIs, Data Science, Machine Learning and Product Management</desc>

  <defs>
